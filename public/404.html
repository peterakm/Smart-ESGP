<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Page not found | Smart-ESGP</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #102820;
        background: #f6faf7;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(90vw, 560px);
        padding: 40px;
        border: 1px solid #c4e6d5;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 24px 70px rgb(15 122 85 / 16%);
      }

      p {
        color: #475569;
        line-height: 1.6;
      }

      .mark {
        width: 56px;
        height: 56px;
        object-fit: contain;
      }

      h1 {
        font-family: Poppins, Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 28px;
        line-height: 36px;
        font-weight: 600;
      }

      a {
        display: inline-flex;
        margin-top: 16px;
        min-height: 44px;
        align-items: center;
        border-radius: 999px;
        background: #0f7a55;
        color: #ffffff;
        padding: 0 18px;
        font-weight: 600;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #a7f06a;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/smart-esgp-mark.png" alt="" aria-hidden="true" width="56" height="56" />
      <p>404</p>
      <h1>Page not found</h1>
      <p>The Smart-ESGP workspace does not have a public page at this address.</p>
      <a href="/">Return to workspace</a>
    </main>
  </body>
</html>
